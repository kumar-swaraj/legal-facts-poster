[project]
name = "legal-facts-poster"
version = "0.1.1"
description = "Autonomous AI agent and browser automation worker for publishing Indian legal insights"
readme = "README.md"
authors = [
    { name = "Kumar Swaraj", email = "123369109+kumar-swaraj@users.noreply.github.com" }
]
license = "MIT"
keywords = [
    "ai-agent",
    "browser-automation",
    "playwright",
    "legal-facts",
    "indian-law",
    "autonomous-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.20.0",
    "playwright>=1.40.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "schedule>=1.2.0",
]

[project.urls]
Homepage = "https://github.com/kumar-swaraj/legal-facts-poster"
Documentation = "https://github.com/kumar-swaraj/legal-facts-poster#readme"
Repository = "https://github.com/kumar-swaraj/legal-facts-poster"
Issues = "https://github.com/kumar-swaraj/legal-facts-poster/issues"
Changelog = "https://github.com/kumar-swaraj/legal-facts-poster/releases"

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[project.scripts]
legal-post = "legal_facts_poster.cli:main"
legal-facts-poster = "legal_facts_poster.cli:main"
legal-config = "legal_facts_poster.wizard:run_wizard"
post-once = "legal_facts_poster.cli:post_once_cli"
poster = "legal_facts_poster.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "S",   # flake8-bandit security rules
]
ignore = [
    "E501",  # Line length handled by ruff format
    "B008",  # Argument default function calls
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
